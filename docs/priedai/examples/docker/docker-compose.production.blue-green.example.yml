# Optional blue-green production example.
# Keep docker-compose.production.example.yml as the default single-slot
# deployment. Use this file only when the application needs two replaceable
# application slots and a balancer that can switch between them.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  networks: [internal]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-php-runtime: &php-runtime
  <<: *runtime-defaults
  environment:
    DB_HOST: mysql
    REDIS_HOST: redis
  secrets:
    - source: application_env
      target: /var/www/.env
  volumes:
    - application_storage:/var/www/storage
    - application_bootstrap_cache:/var/www/bootstrap/cache
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

x-nginx-runtime: &nginx-runtime
  <<: *runtime-defaults

services:
  mysql:
    image: mysql:8.4@sha256:REPLACE_WITH_CURRENT_DIGEST
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_password, mysql_root_password]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:REPLACE_WITH_CURRENT_DIGEST
    <<: *runtime-defaults
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  php-blue:
    <<: *php-runtime
    image: ${PHP_IMAGE_BLUE:?PHP_IMAGE_BLUE is required}
    expose: [9000]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  php-green:
    <<: *php-runtime
    image: ${PHP_IMAGE_GREEN:?PHP_IMAGE_GREEN is required}
    expose: [9000]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-blue:
    <<: *php-runtime
    image: ${PHP_IMAGE_BLUE:?PHP_IMAGE_BLUE is required}
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3"]

  worker-green:
    <<: *php-runtime
    image: ${PHP_IMAGE_GREEN:?PHP_IMAGE_GREEN is required}
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3"]

  nginx-blue:
    <<: *nginx-runtime
    image: ${NGINX_IMAGE_BLUE:?NGINX_IMAGE_BLUE is required}
    depends_on:
      php-blue:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/storage:ro
    expose: [8080]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx-green:
    <<: *nginx-runtime
    image: ${NGINX_IMAGE_GREEN:?NGINX_IMAGE_GREEN is required}
    depends_on:
      php-green:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/storage:ro
    expose: [8080]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  balancer:
    <<: *runtime-defaults
    image: ${BALANCER_IMAGE_REF:?BALANCER_IMAGE_REF is required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${BALANCER_CONFIG_DIR:?BALANCER_CONFIG_DIR is required}/active.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    internal: true

volumes:
  application_storage:
  application_bootstrap_cache:
  mysql_data:
  redis_data:

secrets:
  application_env:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/application.env
  mysql_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/mysql_password
  mysql_root_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/mysql_root_password
  redis_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/redis_password
