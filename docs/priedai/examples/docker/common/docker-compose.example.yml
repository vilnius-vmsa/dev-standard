# Inactive example. Copy to the application root as docker-compose.yml and
# replace every placeholder. Never use this file as production configuration.

name: application-dev

# Applied to every container: servers and databases keep time in UTC
# (ARCH-API-P13), the same zone as date.timezone in php.prod.ini, so that
# application timestamps, database time functions and logs agree. Local time
# is a presentation concern (the application and Grafana convert it).
x-container-environment: &container-environment
  TZ: UTC

# Local log rotation: json-file keeps logs readable through the Docker API,
# which Alloy uses; without limits they fill the host disk.
x-logging: &application-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# Same labels as in production, so that local log shipping (the separate
# docker-compose.observability.yml project) can be tested with this stack.
x-log-labels:
  mysql: &mysql-log-labels
    app.logging.enabled: "true"
    app.logging.component: "mysql"
    app.logging.service_name: "<application>-mysql"
    app.logging.type: "database"
  redis: &redis-log-labels
    app.logging.enabled: "true"
    app.logging.component: "redis"
    app.logging.service_name: "<application>-redis"
    app.logging.type: "cache"
  php: &php-log-labels
    app.logging.enabled: "true"
    app.logging.component: "php"
    app.logging.service_name: "<application>-php"
    app.logging.type: "application"
  worker: &worker-log-labels
    app.logging.enabled: "true"
    app.logging.component: "worker"
    app.logging.service_name: "<application>-worker"
    app.logging.type: "application"
  nginx: &nginx-log-labels
    app.logging.enabled: "true"
    app.logging.component: "nginx"
    app.logging.service_name: "<application>-nginx"
    app.logging.type: "http"

x-app-defaults: &app-defaults
  logging: *application-logging
  build:
    context: .
    dockerfile: docker/php-fpm/Dockerfile.dev
  working_dir: /var/www
  env_file:
    - .env
  environment:
    <<: *container-environment
    REDIS_HOST: redis
    DB_HOST: mysql
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]

services:
  mysql:
    labels: *mysql-log-labels
    logging: *application-logging
    image: mysql:8.4@sha256:REPLACE_WITH_CURRENT_DIGEST
    environment:
      <<: *container-environment
      MYSQL_DATABASE: ${DB_DATABASE:-application}
      MYSQL_USER: ${DB_USERNAME:-application}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_password, mysql_root_password]
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    labels: *redis-log-labels
    logging: *application-logging
    environment: *container-environment
    image: redis:7.4-alpine@sha256:REPLACE_WITH_CURRENT_DIGEST
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  php:
    labels: *php-log-labels
    <<: *app-defaults
    volumes:
      - .:/var/www
      - ./docker/php-fpm/composer:/home/app/.composer
    expose: [9000]

  worker:
    labels: *worker-log-labels
    <<: *app-defaults
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3"]

  nginx:
    labels: *nginx-log-labels
    logging: *application-logging
    environment: *container-environment
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.dev
    depends_on:
      php:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks: [internal]

  # Log export is not part of this file and needs no Compose profile: it is
  # the separate docker-compose.observability.yml project, which can also be
  # started locally next to this stack when log shipping has to be tested.

networks:
  internal:
    name: application-dev-internal

volumes:
  mysql_data:
  redis_data:

# docker/secrets is the default for local development only. It is inside the
# build context of the services above, so it must be listed in .dockerignore
# (example: dockerignore.example) and in .gitignore. Deployed environments do
# not use it: there SECRETS_DIR is a host directory outside the repository.
secrets:
  mysql_password:
    file: ${SECRETS_DIR:-docker/secrets}/mysql_password
  mysql_root_password:
    file: ${SECRETS_DIR:-docker/secrets}/mysql_root_password
  redis_password:
    file: ${SECRETS_DIR:-docker/secrets}/redis_password
