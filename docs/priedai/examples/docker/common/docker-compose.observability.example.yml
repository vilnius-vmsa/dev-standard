# Inactive example. Copy to the application root as
# docker-compose.observability.yml and replace every placeholder.
#
# Log and metrics export is a separate Compose project, not a service of the
# application Compose file. The same file therefore serves the single-slot
# and the blue-green topology unchanged, and a failed application rollout
# does not stop log shipping. CD: Deploy starts it after every deployment,
# also after a failed one.
#
# Alloy never mounts the Docker socket. A socket proxy exposes only the
# read-only API endpoints that container discovery and log collection need;
# a mounted socket, even read-only, would give full control of the host.
#
# Inputs, written by the runtime-secrets helper into SECRETS_DIR:
#   alloy.env       non-secret Alloy settings (for example LOKI_URL,
#                   LOKI_USERNAME); read by Compose on the host;
#   loki_password   the push credential, mounted as a secret.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-observability

# UTC everywhere (ARCH-API-P13), as in the application Compose file.
x-container-environment: &container-environment
  TZ: UTC

x-logging: &observability-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  docker-socket-proxy:
    image: ghcr.io/linuxserver/socket-proxy@sha256:REPLACE_WITH_CURRENT_DIGEST
    restart: unless-stopped
    logging: *observability-logging
    # The proxy must open the root-owned Docker socket.
    user: "0:0"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 64M
    environment:
      <<: *container-environment
      # Read-only discovery and log endpoints; everything else is denied.
      CONTAINERS: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      EVENTS: "0"
      POST: "0"
    networks: [docker_socket_proxy]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /run:size=1m,mode=0755
      - /tmp:size=4m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=3", "-O", "/dev/null", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy@sha256:REPLACE_WITH_CURRENT_DIGEST
    restart: unless-stopped
    logging: *observability-logging
    # The unprivileged alloy account of the official image.
    user: "473:473"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    environment: *container-environment
    env_file:
      - ${SECRETS_DIR:?SECRETS_DIR is required}/alloy.env
    secrets:
      - source: loki_password
        target: loki_password
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    networks:
      # default: egress to the central platform; the proxy network is internal.
      - default
      - docker_socket_proxy
    ports:
      # Host-local UI and metrics only.
      - "127.0.0.1:12345:12345"
    volumes:
      # Example: alloy/config.alloy.example. It reads containers from the
      # socket proxy at http://docker-socket-proxy:2375.
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_state:/var/lib/alloy/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  alloy_state:

secrets:
  loki_password:
    file: ${SECRETS_DIR:?SECRETS_DIR is required}/loki_password

networks:
  docker_socket_proxy:
    internal: true
