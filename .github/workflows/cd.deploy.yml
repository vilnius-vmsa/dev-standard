name: "CD: Deploy to GitHub Pages"

run-name: "Deploy ${{ inputs.tag_name }} to GitHub Pages"

# Started only by dispatch: the release workflow dispatches it with the tag to serve, and redeploys are run by hand.
# Its releases, created with GITHUB_TOKEN, would not trigger `release: published` anyway.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Published release tag to serve at the site root (an older one rolls the site back)"
        required: true
        type: string

concurrency:
  group: github-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Add earlier versions
        # Releases before this one appear in the site's version dropdown; tags made before the dropdown existed build
        # only their own docs. A patch to an older minor release is listed by deploying the newest release again.
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ -f scripts/versions/cli.mjs ]]; then
            npm run versions:snapshot -- --current="$TAG_NAME"
          else
            echo "::notice::${TAG_NAME} predates the version dropdown; building its own docs only."
          fi
      - name: Build website
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
