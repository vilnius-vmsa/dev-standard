name: "CI: Create release tag"

run-name: "Release ${{ inputs.tag_name || github.ref_name }} by @${{ github.actor }}"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag (SemVer, for example v1.2.3)"
        required: true
        type: string
      release_description:
        description: "Why is this tag/release being created?"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

env:
  # A release tag: v and three numbers without leading zeros. RELEASE_TAG in scripts/versions/lib/select.mjs is the same.
  RELEASE_TAG_PATTERN: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

jobs:
  create-release:
    name: Create tag and GitHub Release
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Validate release input
        id: validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          RELEASE_DESCRIPTION: ${{ inputs.release_description }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "::error::Tag must contain only a v prefix and three numbers, for example v1.2.3."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -z "${RELEASE_DESCRIPTION//[[:space:]]/}" ]]; then
            echo "::error::Release description must explain why the tag is being created."
            exit 1
          fi

          tag_exists=false
          release_sha="$(git rev-parse HEAD)"

          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            tag_exists=true
            release_sha="$(git rev-list -n 1 "$TAG_NAME")"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "::error::Pushed tag ${TAG_NAME} could not be checked out."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release ${TAG_NAME} already exists."
            exit 1
          fi

          newest_tag="$( { git tag --list 'v*'; echo "$TAG_NAME"; } | grep -E "$RELEASE_TAG_PATTERN" | sort -V | tail -n 1)"
          # A new tag is created on main, which already contains every release, so it must be the newest version.
          if [[ "$tag_exists" == "false" && "$newest_tag" != "$TAG_NAME" ]]; then
            echo "::error::${TAG_NAME} is older than ${newest_tag}, but would tag main. To patch an older minor release, push the tag from a branch cut from that release."
            exit 1
          fi

          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "newest_tag=${newest_tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Build website
        run: npm run build

      - name: Install PDF browser
        run: npx playwright install --with-deps chromium

      - name: Build PDF
        run: npm run build:pdf

      - name: Build agent bundle
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          npm run rules:validate -- --strict
          npm run rules:bundle -- --out=artifacts/bundle --version="$TAG_NAME"
          (cd artifacts/bundle && zip -qr ../dev-standard-agent-bundle.zip .)

      - name: Create tag and release with generated changelog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          TAG_EXISTS: ${{ steps.validate.outputs.tag_exists }}
          RELEASE_DESCRIPTION: ${{ inputs.release_description }}
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
          NEWEST_TAG: ${{ steps.validate.outputs.newest_tag }}
        run: |
          set -euo pipefail

          source_flags=(--target "$RELEASE_SHA")
          if [[ "$EVENT_NAME" == "push" || "$TAG_EXISTS" == "true" ]]; then
            source_flags=(--verify-tag)
          fi

          notes_flags=()
          if [[ -n "${RELEASE_DESCRIPTION//[[:space:]]/}" ]]; then
            printf '%s\n\n' "$RELEASE_DESCRIPTION" > release-notes.md
          else
            : > release-notes.md
          fi

          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" != "$TAG_NAME" \
              && "$candidate" =~ $RELEASE_TAG_PATTERN ]] \
              && git merge-base --is-ancestor "$candidate" "$RELEASE_SHA"; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --sort=-version:refname)

          commit_range="$RELEASE_SHA"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${RELEASE_SHA}"
          fi

          printf '## Changes\n\n' >> release-notes.md
          commit_count=0
          while IFS=$'\t' read -r commit_sha short_sha subject; do
            printf -- '- %s ([`%s`](%s/%s/commit/%s))\n' \
              "$subject" "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$commit_sha" \
              >> release-notes.md
            commit_count=$((commit_count + 1))
          done < <(git log --no-merges --pretty=tformat:'%H%x09%h%x09%s' "$commit_range")

          if [[ "$commit_count" -eq 0 ]]; then
            echo "::error::No commits found for release ${TAG_NAME}."
            exit 1
          fi

          notes_flags=(--notes-file release-notes.md)

          # Only the newest release is "Latest": the sync action and the "latest PDF" link follow it, so a patch to an
          # older minor release must not take it.
          latest_flag=--latest=false
          if [[ "$NEWEST_TAG" == "$TAG_NAME" ]]; then
            latest_flag=--latest
          fi

          gh release create "$TAG_NAME" \
            "artifacts/dev-standard.pdf#Programinės įrangos kūrimo standartas (${TAG_NAME})" \
            "artifacts/dev-standard-agent-bundle.zip#Agent bundle (${TAG_NAME})" \
            "artifacts/bundle/rules.json#Rules (JSON)" \
            --title "$TAG_NAME" \
            --generate-notes \
            "$latest_flag" \
            "${source_flags[@]}" \
            "${notes_flags[@]}"

      - name: Trigger release deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          NEWEST_TAG: ${{ steps.validate.outputs.newest_tag }}
        run: |
          set -euo pipefail
          # The site root keeps the newest release; a patch to an older minor release appears in its version dropdown.
          if [[ "$NEWEST_TAG" != "$TAG_NAME" ]]; then
            echo "::notice::${TAG_NAME} patches an older minor release; deploying ${NEWEST_TAG} so the site root stays on the newest release."
          fi
          gh workflow run cd.deploy.yml --ref main --field tag_name="$NEWEST_TAG"
